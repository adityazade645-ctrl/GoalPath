<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillPath Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shape shape-one"></div>
    <div class="bg-shape shape-two"></div>
    <div class="bg-shape shape-three"></div>

    <main class="login-page">
        <div class="login-card">
            <h1>🚀 SkillPath</h1>
            <p class="login-subtitle">Sign in to access your career roadmap</p>

            <form id="loginForm" class="form-card">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>

                <button type="submit" class="submit-button">Sign In</button>
            </form>

            <p class="login-hint">Demo login: any valid email + any password</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
