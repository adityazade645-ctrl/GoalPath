<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillPath Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shape shape-one"></div>
    <div class="bg-shape shape-two"></div>
    <div class="bg-shape shape-three"></div>

    <main class="login-page">
        <div class="login-card">
            <h1>🚀 Create Account</h1>
            <p class="login-subtitle">Sign up to access SkillPath</p>

            <form id="signupForm" class="form-card">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Create password" required>
                </div>

                <button type="submit" class="submit-button">Sign Up</button>
            </form>

            <p class="login-hint">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
